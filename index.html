<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon-link" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page draw under the iOS notch/home-
         indicator and Android gesture-nav areas instead of leaving them
         a plain black bar; components that sit at the true edges (see
         env(safe-area-inset-*) in src/styles/native.css) pad themselves
         clear of those areas explicitly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#07060a" />
    <!-- Lets someone add jdk.org to their home screen (iOS "Add to
         Home Screen", Android's install prompt) and have it open full-
         screen like a native app, still served from the same site —
         no separate app store build. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JDK" />
    <!-- Raster fallbacks alongside the SVG favicon above (which applyTheme.js
         can swap at runtime from branding.faviconUrl). Safari only accepts
         PNG for apple-touch-icon, so that one points at a real 180×180 PNG. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>JDK</title>
    <meta id="meta-description" name="description" content="JDK — AI-powered technology & innovation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="google-fonts-link"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Syne:wght@500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
